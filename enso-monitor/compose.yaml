services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: enso_monitor
      POSTGRES_USER: enso_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
